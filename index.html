<!doctype html>
<html lang="en" data-theme="dark" data-layout="desktop">
<head>
<meta charset="utf-8">
<!-- Deploy-ready static site: publish this folder as-is (see netlify.toml / README.md).
     Plate images live in img/ - app.js loads them as "img/" + file. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>HistoAtlas — the 57 histology slides</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css?v=261007a">
</head>
<body>
<header class="topbar">
  <button class="tb-btn icon burger" id="burger" title="Browse slides" aria-label="Browse slides">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="brand" onclick="location.hash='#/home'">
    <span class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></svg>
    </span>
    <span><h1>HistoAtlas</h1><small>the 57 slides · oral exam</small></span>
  </div>
  <div class="searchwrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Search slides…  ( / )" autocomplete="off">
  </div>
  <button class="tb-btn icon" id="search-btn" title="Search" aria-label="Search" style="display:none">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </button>
  <div class="seg" id="view-seg" title="Layout mode">
    <button data-v="auto" title="Auto layout">A</button>
    <button data-v="phone" title="Phone layout">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg>
    </button>
    <button data-v="desktop" title="Desktop layout">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="2" y="3" width="20" height="13" rx="2"/><path d="M8 21h8M12 16v5"/></svg>
    </button>
  </div>
  <button class="tb-btn hidephone" onclick="location.hash='#/stains'" title="Stains at a glance">★<span class="lbl"> Stains</span></button>
  <button class="tb-btn icon" id="theme-btn" title="Toggle theme"></button>
  <div class="readbar" id="readbar"></div>
</header>

<div class="searchrow" id="searchrow">
  <div class="searchwrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q2" placeholder="Search the 57 slides…" autocomplete="off">
  </div>
</div>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

<div class="scrim" id="scrim"></div>

<nav class="botnav" id="botnav">
  <button data-r="home"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg>Home</button>
  <button data-r="slides"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></svg>Slides</button>
  <button data-r="stains"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 2.7s6.5 7 6.5 11.3a6.5 6.5 0 0 1-13 0C5.5 9.7 12 2.7 12 2.7Z"/></svg>Stains</button>
</nav>

<div class="lb-overlay" id="lb">
  <div class="lb-stage" id="lb-stage">
    <div id="lb-wrap"><img id="lb-img" alt="histology plate"></div>
    <div class="lb-marker" id="lb-marker"></div>
    <div class="lb-mlabel" id="lb-mlabel"></div>
    <button class="lb-btn lb-close" id="lb-close" title="Close (Esc)">✕</button>
    <div class="lb-bar">
      <button class="lb-btn" id="lb-prev" title="Previous plate">‹</button>
      <button class="lb-btn" id="lb-next" title="Next plate">›</button>
      <span class="cap" id="lb-cap"></span>
      <button class="lb-btn" id="lb-out" title="Zoom out">−</button>
      <button class="lb-btn" id="lb-in" title="Zoom in">+</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<button class="totop" id="totop" title="Back to top" aria-label="Back to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5m-7 7 7-7 7 7"/></svg>
</button>

<script src="data.js?v=261007a"></script>
<script src="cc.js?v=261007a"></script>
<script src="app.js?v=261007a"></script>
</body>
</html>
